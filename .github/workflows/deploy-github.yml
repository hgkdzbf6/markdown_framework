name: Simple Deploy Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout framework code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Checkout markdown files
        uses: actions/checkout@v4
        with:
          repository: hgkdzbf6/worknote
          path: markdown
          token: ${{ secrets.MY_TOKEN }}

      - name: Prepare files
        run: |
          mkdir -p output
          cp markdown/*.md output/

      - name: Build HTML
        run: |
          cd output
          node ../parser-final-final.js

      - name: Create index.html
        run: |
          cat > index.html << 'EOF'
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw 文档库</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0F0F23;
            color: #E2E8F0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #8B5CF6; }
        .doc-link {
            display: block;
            padding: 10px;
            margin: 5px 0;
            background: rgba(139, 92, 246, 0.1);
            color: #E2E8F0;
            text-decoration: none;
            border-radius: 5px;
        }
        .doc-link:hover {
            background: rgba(139, 92, 246, 0.2);
        }
    </style>
</head>
<body>
    <h1>📚 OpenClaw 文档库</h1>
    <p>自动部署时间: $(date)</p>
    <hr>
EOF

          for file in output/*.html; do
            filename=$(basename "$file")
            echo "  <a href=\"$filename\" class=\"doc-link\">$filename</a>" >> index.html
          done

          cat >> index.html << 'EOF'
</body>
</html>
EOF

          cp index.html output/
          cp output/*.html ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: .

      - name: Display files
        run: |
          echo "Generated files:"
          ls -lh *.html
