name: Auto Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout framework code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Checkout markdown files from worknote
        uses: actions/checkout@v4
        with:
          repository: hgkdzbf6/worknote
          path: markdown
          token: ${{ secrets.MY_TOKEN }}

      - name: Prepare files
        run: |
          mkdir -p output
          cp markdown/*.md output/ 2>/dev/null || echo "No markdown files found"
          ls -la output/

      - name: Build HTML
        run: |
          cd output
          node ../parser-final-final.js || echo "Build failed, continuing..."

      - name: Create index.html
        run: |
          cat > index.html << 'EOF'
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw 文档库</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0F0F23;
            color: #E2E8F0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #8B5CF6; }
        .doc-link {
            display: block;
            padding: 10px;
            margin: 5px 0;
            background: rgba(139, 92, 246, 0.1);
            color: #E2E8F0;
            text-decoration: none;
            border-radius: 5px;
        }
        .doc-link:hover {
            background: rgba(139, 92, 246, 0.2);
        }
        .timestamp {
            color: #94A3B8;
            font-size: 0.9em;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>📚 OpenClaw 文档库</h1>
    <p>自动部署时间: $(date)</p>
    <hr>
EOF

          if [ -d "output" ]; then
            for file in output/*.html; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                echo "  <a href=\"$filename\" class=\"doc-link\">$filename</a>" >> index.html
              fi
            done
          fi

          cat >> index.html << 'EOF'
    <p class="timestamp">Powered by OpenClaw Markdown Framework</p>
</body>
</html>
EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Display deployment URL
        run: |
          echo "✅ Deployment successful!"
          echo "📤 Your site is now live at:"
          echo "https://hgkdzbf6.github.io/"
